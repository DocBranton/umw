name: Commit refreshed lockfile

# One-off: regenerates package-lock.json on the runner (same npm install as
# CAD CI's lockfile artifact) and commits it to claude/cad-port.
# Removed in the next commit once the lockfile lands.
on:
  push:
    branches: ["claude/cad-port"]
    paths: [".github/workflows/lockfile-sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/cad-port

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package-lock.json
        run: npm install --ignore-scripts

      - name: Commit package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock.json for three and @types/three" -m "Generated on the GitHub runner with npm install (Node 22), matching the CAD CI lockfile artifact."
          git push origin HEAD:claude/cad-port
