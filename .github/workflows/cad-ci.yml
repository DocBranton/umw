name: CAD CI

on:
  pull_request:
    paths:
      - "client/src/cad/**"
      - "client/src/components/workbench.tsx"
      - "client/src/components/eng-overview.tsx"
      - "client/public/cad/**"
      - "client/public/vendor/occt/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.client.json"
      - ".github/workflows/cad-ci.yml"
  push:
    branches:
      - "claude/cad-port"
      - "claude/cad-*"
    paths:
      - "client/src/cad/**"
      - "client/src/components/workbench.tsx"
      - "client/src/components/eng-overview.tsx"
      - "client/public/cad/**"
      - "client/public/vendor/occt/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.client.json"
      - ".github/workflows/cad-ci.yml"

permissions:
  contents: read

concurrency:
  group: cad-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Task 0 intentionally uses npm install once because PR #1 added three
      # dependencies without refreshing package-lock.json. The generated lockfile
      # is uploaded below so the exact npm result can be committed to the branch.
      - name: Install dependencies
        run: npm install

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cad-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Report lockfile drift
        run: git diff -- package-lock.json
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: CAD tests
        run: npm run test:cad
